<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
        let now = new Date();
        document.write(now);
        document.write(`<p>${now.toLocaleDateString()}</p>`);
        document.write(`<p>${now.toLocaleTimeString()}</p>`);
    
    </script>
  </body>
</html>
