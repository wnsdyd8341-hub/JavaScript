<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        let grade = prompt(" 점수 입력 : ");
        

        switch((parseInt)(grade/10)){
            case 10:
                document.write("A");
                break;
            case 9:
                document.write("B");
                break;
            case 8:
                document.write("C");
                break;
            default:
                document.write("F");
                break;
            }
        
    </script>
</body>
</html>
